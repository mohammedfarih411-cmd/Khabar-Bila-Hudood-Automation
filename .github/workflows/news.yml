name: News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6,18 * * *"
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m unittest discover -s tests -v

  run-news:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: news-automation-production
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore duplicate database
        uses: actions/cache/restore@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate production secrets
        shell: bash
        run: |
          python - <<'PY'
          import os

          required = (
              "GEMINI_API_KEY",
              "ELEVENLABS_API_KEY",
              "ELEVENLABS_VOICE_ID",
              "YOUTUBE_TOKEN_JSON",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("Production secrets are configured.")
          PY

      - name: Run news production and private upload
        run: python -m src.main

      - name: Save duplicate database
        if: success() && hashFiles('data/news.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/news.db
          key: news-db-${{ github.run_id }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-failure-${{ github.run_number }}
          path: |
            logs/
            output/
          if-no-files-found: ignore
          retention-days: 3
