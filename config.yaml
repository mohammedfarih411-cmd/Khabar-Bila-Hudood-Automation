project:
  name: "Khabar Bila Hudood Automation"
  language: "ar"
  timezone: "Europe/Rome"

news:
  max_articles: 30
  publish_per_run: 5

  priority:
    - italy
    - immigration
    - world

  exclude_categories:
    - economy
    - finance
    - stocks
    - crypto

  duplicate_days: 30

sources:
  rss:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://rss.dw.com/xml/rss-en-all

ai:
  enabled: true
  provider: google
  model: gemini-3.1-pro-preview
  temperature: 0.2
  minimum_confidence: 0.80

seo:
  hashtags: 5
  max_title_length: 100
  max_description_length: 4000

production:
  enabled: true
  output_dir: output

tts:
  provider: elevenlabs
  model: eleven_multilingual_v2
  timeout_seconds: 120

thumbnail:
  width: 1280
  height: 720
  format: jpg
  brand: "خبر بلا حدود"
  # Optional local path. Noto Naskh Arabic and Cairo are preferred automatically.
  font_path: ""

video:
  resolution: "1920x1080"
  fps: 30
  format: mp4
  music_volume: 0.25
  zoom_percent: 4.0
  pan_percent: 35.0

youtube:
  upload_enabled: true
  privacy: private
  category: 25
  made_for_kids: false
  token_path: token.json

database:
  path: data/news.db

logging:
  level: INFO
  file: logs/app.log

scheduler:
  enabled: true
  interval_minutes: 30
